# Desktop app, JEV Studio (Tauri 2 shell in desktop/): build on Windows, macOS and Linux for every change to
# the shell, the site or the backend; on a v* tag, publish a GitHub release with every installer
# and a SHA256SUMS.txt.
#
# Supply chain: every third-party action is pinned to a full commit SHA (version in the comment).
# Permissions: read-only everywhere except the release job, which alone gets contents: write.

name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - desktop/**
      - site/**
      - jepa_studio/**
      - jev/**
      - requirements-desktop.txt
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - site/**
      - jepa_studio/**
      - jev/**
      - requirements-desktop.txt
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $have"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            build-essential pkg-config patchelf file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # release builds (v* tags) never restore a cache, so a poisoned cache can't reach installers
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-30
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the pinned Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: desktop
          tauriScript: npm run tauri --
          # No `args: --ci`: tauri-action puts args after `--`, so cargo got `--ci` and failed
          # ("unexpected argument"). The CLI already runs non-interactively when CI=true.
          # No tagName/releaseId: this step only builds. Publishing happens in the release job,
          # the only job with write access.

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          b=desktop/src-tauri/target/release/bundle
          mkdir -p dist
          find "$b" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          # The macOS .app bundle is a folder; ship it as a tarball next to the .dmg.
          if [ -d "$b/macos" ]; then
            for app in "$b"/macos/*.app; do
              tar -C "$(dirname "$app")" -czf "dist/$(basename "$app" .app)_${{ matrix.name }}.app.tar.gz" "$(basename "$app")"
            done
          fi
          ls -l dist
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jev-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jev-studio-*
          path: dist
          merge-multiple: true

      - name: SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "JEV Studio $TAG" \
            --notes "Desktop installers for Windows (.msi, setup .exe), macOS (.dmg, .app) and Linux (.deb, .AppImage). Verify downloads against SHA256SUMS.txt (sha256sum -c SHA256SUMS.txt --ignore-missing). The first launch installs a private Python environment; see docs/desktop.md. The JEV agent also needs Ollama (https://ollama.com) and one model; see docs/jev/README.md." \
            $prerelease
