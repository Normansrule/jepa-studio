name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary is used instead of gitleaks-action (which needs a licence key for
      # organisation accounts). Its SHA-256 is pinned here and checked before it runs; the value
      # is from gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
      - name: Install gitleaks 8.30.1 (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 .
