[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-studio"
version = "0.4.1"
description = "JEV Studio: a local AI agent (Ollama) that answers, codes, makes images and videos and renders physics, plus LeJEPA (JEPA + SIGReg) models you train on your own data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksander Norman" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "safetensors>=0.4",
  "pillow>=10.3",
  "psutil>=5.9",
  "cryptography>=42",
  "imageio>=2.34",
]
keywords = ["jepa", "lejepa", "self-supervised learning", "world model", "sigreg", "local ai agent", "ollama", "black hole", "ray tracing", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.5"]
onnx = ["onnx>=1.16", "onnxscript>=0.3", "onnxruntime>=1.18"]
assistant = ["llama-cpp-python>=0.2"]
jev = ["matplotlib>=3.8"]
# JEV media: charts/equations on slides, code highlighting, bundled ffmpeg
media = ["imageio-ffmpeg>=0.5", "matplotlib>=3.8", "pygments>=2.17"]
# Optional local generative image/video models (needs an NVIDIA GPU; weights are separate downloads)
gen = ["diffusers>=0.33", "transformers>=4.44", "accelerate>=0.33", "sentencepiece>=0.2", "ftfy>=6.2", "huggingface_hub>=0.24"]
# Piper TTS is deliberately not an extra: piper-tts >= 1.3 is GPL-3.0; install it yourself (docs/jev/media.md)
dev = ["pytest>=8", "playwright>=1.44", "ruff>=0.5"]

[project.scripts]
jepa-studio = "jepa_studio.cli:main"
jev = "jev.cli:main"

[project.urls]
Homepage = "https://normansrule.github.io/jev-jepa-studio/"
Source = "https://github.com/Normansrule/jev-jepa-studio"

[tool.setuptools.packages.find]
include = ["jepa_studio*", "jev*"]

[tool.setuptools.package-data]
jepa_studio = ["config.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer end-to-end tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["desktop/src-tauri/target", "desktop/node_modules", "ref"]

[tool.ruff.lint]
ignore = ["E741"]  # short math names (l, I) mirror the papers' notation
